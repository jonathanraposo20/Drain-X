services:
  - type: web
    name: drainx-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/liveness
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SYSTEM_MODE
        value: SIMULATION
      - key: SUPABASE_AUTH_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_STORAGE_BACKEND
        value: database
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: RATE_LIMIT_KEY_PEPPER
        sync: false
      - key: DEVICE_INGEST_API_KEY
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false
